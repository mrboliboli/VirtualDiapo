spring.application.name=VirtualDiapo
server.address=0.0.0.0
server.port=8080
spring.web.resources.cache.cachecontrol.max-age=1h
virtualdiapo.data-directory=${user.home}/.virtualdiapo
spring.datasource.url=jdbc:sqlite:${virtualdiapo.data-directory}/virtualdiapo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB
virtualdiapo.image-directory=${virtualdiapo.data-directory}/images
