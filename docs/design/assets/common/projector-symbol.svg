<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="720" viewBox="0 0 1024 720">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#272421"/>
    <stop offset=".55" stop-color="#17191B"/>
    <stop offset="1" stop-color="#0D0F11"/>
  </linearGradient>
  <radialGradient id="lens" cx=".45" cy=".45" r=".62">
    <stop offset="0" stop-color="#FFF3CE"/>
    <stop offset=".25" stop-color="#F5C16C"/>
    <stop offset=".58" stop-color="#E39A3E"/>
    <stop offset="1" stop-color="#7E4A24"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1=".5" x2="1" y2=".5">
    <stop offset="0" stop-color="#F2B35E" stop-opacity=".55"/>
    <stop offset=".72" stop-color="#F2B35E" stop-opacity=".16"/>
    <stop offset="1" stop-color="#F2B35E" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<!-- transparent background -->

<!-- projection screen, matching approved VirtualDiapo symbol -->
<rect x="684" y="86" width="238" height="172" rx="8"
      fill="none" stroke="#F1DFC2" stroke-width="20"/>
<line x1="803" y1="258" x2="803" y2="299" stroke="#F1DFC2" stroke-width="15" stroke-linecap="round"/>

<!-- warm beam -->
<path d="M505 302 L694 148 L694 246 L505 349 Z" fill="url(#beam)"/>

<!-- subtle lens glow -->
<circle cx="491" cy="325" r="92" fill="#E8A84C" opacity=".16" filter="url(#glow)"/>

<!-- projector body -->
<rect x="132" y="260" width="324" height="182" rx="44"
      fill="url(#body)" stroke="#F1DFC2" stroke-width="17"/>
<rect x="157" y="283" width="92" height="136" rx="23"
      fill="#E8D4B3" stroke="#F1DFC2" stroke-width="8"/>
<circle cx="196" cy="314" r="9" fill="#17191B"/>

<!-- lens housing -->
<circle cx="455" cy="327" r="89" fill="#121416" stroke="#F1DFC2" stroke-width="16"/>
<circle cx="455" cy="327" r="62" fill="#1A1714" stroke="#B9854C" stroke-width="8"/>
<circle cx="455" cy="327" r="42" fill="url(#lens)" filter="url(#softGlow)"/>
<circle cx="455" cy="327" r="25" fill="#FFF0C7" opacity=".92"/>

<!-- small feet -->
<path d="M188 443 L174 475" stroke="#F1DFC2" stroke-width="15" stroke-linecap="round"/>
<path d="M388 443 L402 475" stroke="#F1DFC2" stroke-width="15" stroke-linecap="round"/>
</svg>