<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="bg" cx="50%" cy="43%" r="72%">
    <stop offset="0" stop-color="#202226"/>
    <stop offset="0.62" stop-color="#111316"/>
    <stop offset="1" stop-color="#090B0D"/>
  </radialGradient>

  <radialGradient id="lens" cx="45%" cy="43%" r="62%">
    <stop offset="0" stop-color="#FFF4D4"/>
    <stop offset="0.28" stop-color="#F5C46E"/>
    <stop offset="0.62" stop-color="#E39A3E"/>
    <stop offset="1" stop-color="#75451F"/>
  </radialGradient>

  <linearGradient id="beam" x1="0" y1=".5" x2="1" y2=".5">
    <stop offset="0" stop-color="#F0B45E" stop-opacity=".62"/>
    <stop offset=".72" stop-color="#F0B45E" stop-opacity=".20"/>
    <stop offset="1" stop-color="#F0B45E" stop-opacity="0"/>
  </linearGradient>

  <filter id="lensGlow" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
</defs>

<!-- Square master artwork. No pre-rounded corners: platforms apply their own masks. -->
<rect width="1024" height="1024" fill="url(#bg)"/>

<!-- Screen: deliberately simple, as in the approved VirtualDiapo identity -->
<rect x="637" y="238" width="225" height="170" rx="8"
      fill="none" stroke="#F1DFC2" stroke-width="22"/>
<line x1="750" y1="408" x2="750" y2="454"
      stroke="#F1DFC2" stroke-width="16" stroke-linecap="round"/>

<!-- Warm projection beam -->
<path d="M493 485 L650 292 L650 397 L493 548 Z"
      fill="url(#beam)"/>

<!-- Very restrained optical glow -->
<circle cx="472" cy="515" r="105"
        fill="#E8A84C" opacity=".16" filter="url(#lensGlow)"/>

<!-- Minimal projector body -->
<rect x="178" y="437" width="284" height="160" rx="42"
      fill="#17191B" stroke="#F1DFC2" stroke-width="20"/>

<!-- Small cream control panel -->
<rect x="200" y="458" width="78" height="118" rx="19"
      fill="#E6D0AE" stroke="#F1DFC2" stroke-width="8"/>
<circle cx="230" cy="485" r="8" fill="#17191B"/>

<!-- Lens -->
<circle cx="460" cy="515" r="83"
        fill="#111315" stroke="#F1DFC2" stroke-width="18"/>
<circle cx="460" cy="515" r="57"
        fill="#1A1714" stroke="#B9854C" stroke-width="8"/>
<circle cx="460" cy="515" r="38" fill="url(#lens)"/>
<circle cx="460" cy="515" r="21" fill="#FFF1C9" opacity=".94"/>

<!-- Feet -->
<path d="M225 598 L210 631" stroke="#F1DFC2" stroke-width="17" stroke-linecap="round"/>
<path d="M400 598 L414 631" stroke="#F1DFC2" stroke-width="17" stroke-linecap="round"/>
</svg>
