<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
<defs>
  <radialGradient id="lens" cx="45%" cy="43%" r="62%">
    <stop offset="0" stop-color="#FFF4D4"/>
    <stop offset=".28" stop-color="#F5C46E"/>
    <stop offset=".62" stop-color="#E39A3E"/>
    <stop offset="1" stop-color="#75451F"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1=".5" x2="1" y2=".5">
    <stop offset="0" stop-color="#E8A84C" stop-opacity=".62"/>
    <stop offset=".72" stop-color="#E8A84C" stop-opacity=".20"/>
    <stop offset="1" stop-color="#E8A84C" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Transparent background.
     LIGHT variant = light artwork intended for dark/anthracite backgrounds. -->

<g transform="translate(36 76)">
  <!-- screen -->
  <rect x="304" y="12" width="116" height="88" rx="5"
        fill="none" stroke="#F1DFC2" stroke-width="12"/>
  <line x1="362" y1="100" x2="362" y2="124"
        stroke="#F1DFC2" stroke-width="9" stroke-linecap="round"/>

  <!-- warm projection beam -->
  <path d="M228 136 L312 42 L312 94 L228 168 Z" fill="url(#beam)"/>

  <!-- projector -->
  <rect x="38" y="112" width="160" height="90" rx="24"
        fill="#17191B" stroke="#F1DFC2" stroke-width="12"/>
  <rect x="50" y="124" width="45" height="66" rx="11"
        fill="#E6D0AE" stroke="#F1DFC2" stroke-width="5"/>
  <circle cx="68" cy="140" r="4.5" fill="#17191B"/>

  <!-- lens -->
  <circle cx="198" cy="157" r="48"
          fill="#111315" stroke="#F1DFC2" stroke-width="11"/>
  <circle cx="198" cy="157" r="33"
          fill="#1A1714" stroke="#B9854C" stroke-width="5"/>
  <circle cx="198" cy="157" r="22" fill="url(#lens)"/>
  <circle cx="198" cy="157" r="11" fill="#FFF1C9"/>

  <!-- feet -->
  <path d="M67 204 L60 222" stroke="#F1DFC2" stroke-width="10" stroke-linecap="round"/>
  <path d="M166 204 L173 222" stroke="#F1DFC2" stroke-width="10" stroke-linecap="round"/>
</g>

<!-- wordmark -->
<text x="500" y="213"
      font-family="Inter, Arial, sans-serif"
      font-size="112"
      font-weight="500"
      letter-spacing="12"
      fill="#F1DFC2">VIRTUALDIAPO</text>

<!-- Tagline intentionally remains live UI text. -->
</svg>
